name: Publish to npm

on:
  push:
    tags:
      - 'npm_v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0, 1.0.0-beta.1)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Update npm to latest (for OIDC support)
        run: npm install -g npm@latest

      - name: Publish from tag (push)
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF#refs/tags/npm_v}"
          TAG=$([[ "$VERSION" == *beta* ]] && echo "beta" || echo "latest")
          npm publish --access public --provenance --new-version "$VERSION" --tag "$TAG"

      - name: Publish manually (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG=$([[ "$VERSION" == *beta* ]] && echo "beta" || echo "latest")
          npm publish --access public --provenance --new-version "$VERSION" --tag "$TAG"